services:
  crumbs:
    image: ghcr.io/bretzel-app/crumbs:0.36.2
    container_name: crumbs
    ports:
      - "3000:3000"
    volumes:
      - crumbs-data:/data
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
      - DATABASE_URL=/data/crumbs.db
      - ORIGIN=${ORIGIN:-http://localhost:3000}
      # OAuth / SSO (optional — providers auto-enable when configured)
      - AUTH_GOOGLE_CLIENT_ID=${AUTH_GOOGLE_CLIENT_ID:-}
      - AUTH_GOOGLE_CLIENT_SECRET=${AUTH_GOOGLE_CLIENT_SECRET:-}
      - AUTH_GITHUB_CLIENT_ID=${AUTH_GITHUB_CLIENT_ID:-}
      - AUTH_GITHUB_CLIENT_SECRET=${AUTH_GITHUB_CLIENT_SECRET:-}
      - AUTH_OIDC_ISSUER=${AUTH_OIDC_ISSUER:-}
      - AUTH_OIDC_CLIENT_ID=${AUTH_OIDC_CLIENT_ID:-}
      - AUTH_OIDC_CLIENT_SECRET=${AUTH_OIDC_CLIENT_SECRET:-}
      - AUTH_OIDC_DISPLAY_NAME=${AUTH_OIDC_DISPLAY_NAME:-}
      # Reverse proxy auth (optional, off by default). Requires removing "ports:" above
      # so only the proxy can reach Crumbs. See docs/AUTH.md before enabling.
      - AUTH_PROXY_ENABLED=${AUTH_PROXY_ENABLED:-}
      - AUTH_PROXY_TRUSTED_IPS=${AUTH_PROXY_TRUSTED_IPS:-}
      - AUTH_PROXY_LOGOUT_URL=${AUTH_PROXY_LOGOUT_URL:-}
      - AUTH_PROXY_EMAIL_HEADER=${AUTH_PROXY_EMAIL_HEADER:-}
      - AUTH_PROXY_SECRET_HEADER=${AUTH_PROXY_SECRET_HEADER:-}
      - AUTH_PROXY_SECRET=${AUTH_PROXY_SECRET:-}
      # Email notifications (optional — auto-enabled when SMTP_HOST is set)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    restart: unless-stopped

volumes:
  crumbs-data:
